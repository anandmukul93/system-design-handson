# Shared infrastructure for the chapters. Start with: make up
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: [POSTGRES_USER=dev, POSTGRES_PASSWORD=dev, POSTGRES_DB=dev]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  redpanda:   # Kafka API compatible, much lighter than Kafka + ZooKeeper
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --smp 1 --memory 1G --overprovisioned --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]
  minio:      # S3 API compatible object storage
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment: [MINIO_ROOT_USER=dev, MINIO_ROOT_PASSWORD=devdevdev]
    ports: ["9000:9000", "9001:9001"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
